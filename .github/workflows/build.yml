name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev zip unzip zlib1g-dev openjdk-17-jdk autoconf libtool pkg-config
        pip install cython==0.29.33 buildozer

    - name: Build with Buildozer
      run: |
        buildozer init
        sed -i 's/title = My Application/title = Chafre Agent/g' buildozer.spec
        sed -i 's/package.name = myapp/package.name = chafreagent/g' buildozer.spec
        sed -i 's/requirements = python3,kivy/requirements = python3,flask,requests,urllib3,certifi,chardet,idna/g' buildozer.spec
        sed -i 's/# p4a.bootstrap = sdl2/p4a.bootstrap = webview/g' buildozer.spec
        sed -i 's/# android.permissions = INTERNET/android.permissions = INTERNET/g' buildozer.spec
        
        yes | buildozer -v android debug
        mv bin/*.apk bin/chafre-agent.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: chafre-agent
        path: bin/chafre-agent.apk
        
