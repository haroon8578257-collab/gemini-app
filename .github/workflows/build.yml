name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev zip unzip zlib1g-dev openjdk-17-jdk autoconf libtool pkg-config
        pip install cython==0.29.33 buildozer

    - name: Build with Buildozer
      run: |
        buildozer init
        # App Title aur Package Name set karein
        sed -i 's/title = My Application/title = Chafre Agent/g' buildozer.spec
        sed -i 's/package.name = myapp/package.name = chafreagent/g' buildozer.spec
        
        # Requirements add karein
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy,google-generativeai,requests,urllib3,certifi/g' buildozer.spec
        
        # Build APK
        yes | buildozer -v android debug
        
        # File ka naam chafre-agent.apk rakhein
        mv bin/*.apk bin/chafre-agent.apk

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: chafre-agent
        path: bin/chafre-agent.apk
        
